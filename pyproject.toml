[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "academic-agent"
version = "0.1.0"
description = "A locally hosted academic intelligence agent"
requires-python = ">=3.11"
dependencies = [
    "PyMuPDF==1.28.2",
    "pydantic==2.14.2"
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "pytest-cov>=6,<8"
]

[tool.setuptools.packages.find]
where = ["src"]
